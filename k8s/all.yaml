
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - { name: POSTGRES_DB, value: movies }
            - { name: POSTGRES_USER, value: app }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: password } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: movie-website }
spec:
  replicas: 2
  selector: { matchLabels: { app: movie-website } }
  template:
    metadata: { labels: { app: movie-website } }
    spec:
      containers:
        - name: app
          image: movie-website:dev
          ports: [{ containerPort: 8080 }]
          env:
            - name: JWT_SECRET
              valueFrom:
                {secretKeyRef:
                   {name: jwt-secret, key: secret}}
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/movies" }
            - { name: SPRING_DATASOURCE_USERNAME, value: app }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-secret, key: password } }
            - { name: SPRING_JPA_HIBERNATE_DDL_AUTO, value: update }
---
apiVersion: v1
kind: Service
metadata: { name: movie-website }
spec:
  selector: { app: movie-website }
  ports: [{ port: 8080 }]